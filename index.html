<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Transfer — Legal & Suporte</title>
  
  <!-- GitHub Markdown CSS for clean styling -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  
  <!-- Marked.js to convert Markdown to HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 880px;
      margin: 0 auto;
      padding: 45px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    nav {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 15px;
    }

    .nav-btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      background-color: #f6f8fa;
      cursor: pointer;
      color: #24292e;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .nav-btn:hover {
      background-color: #e1e4e8;
    }

    .nav-btn.active {
      background-color: #0366d6;
      color: white;
      border-color: #0366d6;
    }

    @media (max-width: 767px) {
      body {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <nav>
    <button class="nav-btn active" id="btn-privacy" onclick="showTab('privacy')">Política de Privacidade</button>
    <button class="nav-btn" id="btn-support" onclick="showTab('support')">Suporte</button>
  </nav>

  <!-- Container where Markdown content will render -->
  <main id="content" class="markdown-body">
    Carregando...
  </main>

  <script>
    // Load and render markdown dynamically
    async function loadMarkdown(file) {
      const contentEl = document.getElementById('content');
      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('Falha ao carregar arquivo');
        const text = await response.text();
        contentEl.innerHTML = marked.parse(text);
      } catch (error) {
        contentEl.innerHTML = '<p style="color: red;">Erro ao carregar o conteúdo.</p>';
      }
    }

    function showTab(tab) {
      // Update buttons
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      
      if (tab === 'privacy') {
        document.getElementById('btn-privacy').classList.add('active');
        window.location.hash = 'privacy';
        loadMarkdown('privacy.md');
      } else if (tab === 'support') {
        document.getElementById('btn-support').classList.add('active');
        window.location.hash = 'support';
        loadMarkdown('support.md');
      }
    }

    // Handle deep linking via hash (e.g., index.html#support)
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash === 'support') {
        showTab('support');
      } else {
        showTab('privacy');
      }
    });
  </script>
</body>
</html>
